[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsmith-scanner"
version = "0.3.0"
description = "Security scanner and linter for Claude Agent Skills (SKILL.md): detect prompt injection, data exfiltration, and dangerous code before you install a skill. Web scanner at https://skillsmith.ch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "skillsmith contributors" }]
keywords = ["claude", "anthropic", "agent-skills", "ai-agents", "cli", "linter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
skillsmith = "skillsmith.cli:main"
skillsmith-scanner = "skillsmith.cli:main"

[project.urls]
Homepage = "https://skillsmith.ch"
Repository = "https://github.com/Larslllllll/skillsmith"
Changelog = "https://github.com/Larslllllll/skillsmith/blob/main/CHANGELOG.md"
Issues = "https://github.com/Larslllllll/skillsmith/issues"

[tool.setuptools.packages.find]
include = ["skillsmith*"]
